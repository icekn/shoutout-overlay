<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Shoutout Clip</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* =========================
       BANNER PROMOCIONAL
    ========================== */
    #banner {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 16px 36px;
      border-radius: 14px;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 28px;
      opacity: 0;
      animation: bannerIn 0.8s ease-out forwards;
      z-index: 10;
    }

    /* Animación de entrada */
    @keyframes bannerIn {
      from {
        transform: translate(-50%, 40px);
        opacity: 0;
      }
      to {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    /* Animación de salida */
    @keyframes bannerOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- CLIP TWITCH -->
  <iframe id="clip"></iframe>

  <!-- BANNER -->
  <div id="banner">
    🔴 Sigue a <strong id="canal">este canal</strong> en Twitch
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const clipId = params.get("clip");
    const canal = params.get("canal") || "este canal";
    const duracion = parseInt(params.get("duracion")) || 20;

    document.getElementById("canal").textContent = canal;

    if (clipId) {
      const parents = [
        "icekn.github.io",
        "obs-browser",
        "localhost",
        "127.0.0.1"
      ];

      let src = "https://clips.twitch.tv/embed?clip=" + clipId;

      parents.forEach(p => {
        src += "&parent=" + p;
      });

      src += "&autoplay=true&muted=false";

      document.getElementById("clip").src = src;
    }

    // Ocultar banner automáticamente
    setTimeout(() => {
      const banner = document.getElementById("banner");
      banner.style.animation = "bannerOut 1s ease forwards";
    }, duracion * 1000);
  </script>

</body>
</html>
